services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lean4-web-backend
    restart: unless-stopped
    ports:
      # 호스트 80 포트를 백엔드로 매핑 (기본값: 80 -> 백엔드 포트)
      - "${HOST_HTTP_PORT:-80}:${BACKEND_PORT:-8080}"
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
      - PORT=${BACKEND_PORT:-8080}
    volumes:
      # 호스트 백엔드 소스 코드 실시간 반영
      - ./backend:/app/backend
      # 프론트엔드 빌드 산출물 공유 (홈페이지 정적 서빙)
      - ./frontend/dist:/app/frontend/dist:ro
      # 호스트와 컨테이너 간 빌드 캐시 격리
      - backend_lake_cache:/app/backend/.lake
      # Lean elan 툴체인 캐시
      - backend_elan_cache:/root/.elan
      # 루트 .env 설정 공유
      - ./.env:/app/.env:ro
    networks:
      - lean4-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lean4-web-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
      - BACKEND_HOST=backend
    volumes:
      # 호스트 프론트엔드 소스 코드 실시간 반영 (Vite HMR 활성화)
      - ./frontend:/app/frontend
      # 호스트와 컨테이너 간 node_modules 충돌 방지 및 캐싱
      - frontend_node_modules:/app/frontend/node_modules
      # 루트 .env 설정 공유
      - ./.env:/app/.env:ro
    depends_on:
      - backend
    networks:
      - lean4-net

networks:
  lean4-net:
    driver: bridge

volumes:
  backend_lake_cache:
    name: lean4_backend_lake_cache
  backend_elan_cache:
    name: lean4_backend_elan_cache
  frontend_node_modules:
    name: lean4_frontend_node_modules
